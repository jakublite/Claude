# Ergaenzt src/main/resources/application.properties (config/ hat Vorrang).
# Jeder Spring-Testkontext bekommt eine eigene In-Memory-DB, sonst ueberschreiben sich die Kontexte gegenseitig.
spring.datasource.url=jdbc:h2:mem:test-${random.uuid}
# Die Tests pruefen feste Werte und nutzen deshalb den kleinen Datensatz statt der Demodaten
testdaten.ordner=testdaten
