spring.application.name=seminarverwaltung

# In-Memory-H2, wird bei jedem Start neu aus den CSV-Dateien in testdaten.ordner befuellt
spring.datasource.url=jdbc:h2:mem:seminar
spring.h2.console.enabled=true

# Fehler als RFC-9457 Problem Details, inklusive fachlicher Meldung im Feld "detail"
spring.mvc.problemdetails.enabled=true

testdaten.csv-import=true
testdaten.ordner=demodaten
# Gilt fuer alle Benutzer aus dem CSV-Import. Nur zum Ausprobieren, steht offen im Repository.
testdaten.demo-passwort=demo1234

wetter.geocoding-url=https://geocoding-api.open-meteo.com
wetter.forecast-url=https://api.open-meteo.com
